# cargo-audit configuration.
#
# Read by the `cargo audit` binary run from the repo root. CI runs that same
# binary directly (`audit-rust` in `.github/workflows/ci.yml`), so this file is
# the single source of truth for the ignore set -- local runs and CI cannot
# silently disagree (issue #1248).
#
# Historical note, kept because it explains an entry below. An informational
# `unmaintained` advisory alone was once enough to turn the CI gate red -- not
# because the verdict counted warnings as failures (it did not then), but
# because CI then used the `rustsec/audit-check` action, which tried to publish
# its advisory table as a check run on *any* finding and rethrew the resulting
# permission error instead of falling back to stdout (issue #1252). That action
# was removed on 2026-09-04, so the failure mode is gone with it.
#
# Be clear about what the entries below now do, because it is less than it was.
# `cargo audit` exits non-zero on vulnerabilities, and on a warning only when
# its kind is named in `[output] deny` -- which names `unsound` alone (see
# `[output]` at the end of this file). So an ignore entry for an `unmaintained`
# advisory -- the only kind below today -- suppresses a line of log output and
# changes no CI verdict. They are kept because the rationale and exit condition
# each records are worth having written down, not because removing one would
# turn the gate red. An ignore entry for an `unsound` advisory is different: it
# does hold the gate open, so it has to argue that the unsound code is
# unreachable from what we ship. Make that argument with
# `cargo tree -e normal --target all -i <crate>`, not with the tree cargo-audit
# prints: that one is built from Cargo.lock, which records neither dependency
# kind nor platform, so dev-only and never-built crates look shipped. If any of
# this ever proves false, this paragraph is what is wrong.
#
# Every entry here must carry a date, a rationale, and an exit condition.

[advisories]
ignore = [
    # RUSTSEC-2026-0249 -- `smartstring` is unmaintained (upstream repo archived
    # 2026-05-03). Informational only: there is no vulnerability, and no patched
    # version exists because every version is "affected".
    #
    # Reachability: dev-dependency only. The chain is
    #   smartstring <- swc_ecma_parser 39 <- [dev-dependencies] alms-gateway
    # i.e. it is pulled in solely by `tests/static_assets_parse.rs`, the JS
    # parse-sweep from #829. It is never linked into a shipped artifact.
    #
    # Exit condition: swc_ecma_parser 45 replaced smartstring with compact_str
    # (the advisory's own recommended alternative). Taking it requires three
    # coupled major bumps -- swc_common 21->26, swc_ecma_ast 23->29,
    # swc_ecma_parser 39->45 -- against the parse-sweep's API surface, so it is
    # deferred to its own PR rather than bundled into a CI unblock.
    #
    # Added 2026-08-21. Revisit when the swc bump lands, and drop this entry.
    "RUSTSEC-2026-0249",
]

[output]
# Warning kinds that fail the audit instead of only being printed.
#
# `unsound` -- RustSec's informational category for soundness bugs: a safe API
# that can trigger undefined behaviour, which is where memory-safety bugs land
# when they are not filed as vulnerabilities. `cargo audit` reports them as
# warnings, so without this line one would print in the `Security audit (Rust)`
# log and pass, unread -- the way the yanked-crate warning for `chacha20 0.10.0`
# did, with that crate in the shipped binary (alms-cli -> brush-core -> rand),
# until review of #175. Naming it here also makes cargo-audit report the
# category even if `informational_warnings` is ever narrowed. An unsound
# advisory that is genuinely unreachable goes in `ignore` above, with the usual
# date, rationale and exit condition.
#
# Not `yanked`, deliberately. It would turn this required check red the moment
# anything in Cargo.lock is yanked upstream -- an event outside our control that
# then blocks every merge -- and that trade is its own decision. With chacha20
# at 0.10.2 the tree has no yanked crates, so it can be taken up separately.
#
# Added 2026-09-23.
deny = ["unsound"]

# Not a setting anyone chose: `false` is the default. But cargo-audit (0.22.2)
# rejects an `[output]` table that omits it -- "missing field `quiet`" -- and a
# config parse error kills the audit before it reads Cargo.lock. Keep it.
quiet = false
