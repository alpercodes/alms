[workspace]
members = [
    "crates/alms-gateway",
    "crates/alms-session",
    "crates/alms-runtime",
    "crates/alms-sandbox",
    "crates/alms-channel",
    "crates/alms-cli",
    "crates/alms-core",
    "crates/alms-coordinator",
    "crates/alms-tools",
    "crates/alms-test-support",
]
resolver = "2"

[workspace.package]
version = "0.2.4"
edition = "2024"
authors = ["Enis Alper Kale <17502599+alpercodes@users.noreply.github.com>"]
license = "Apache-2.0"
repository = "https://github.com/alpercodes/alms"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.43", features = ["full", "tracing"] }
tokio-util = { version = "0.7", features = ["codec", "time"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Web framework
axum = { version = "0.8", features = ["ws"] }
tower = { version = "0.5", features = ["full"] }

# HTTP client
reqwest = { version = "0.12", features = ["json", "rustls-tls", "stream"] }

# Concurrency
dashmap = "6.1"
parking_lot = "0.12"

# Tracing & Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# CLI
clap = { version = "4.5", features = ["derive", "env"] }
clap_complete = "4.5"
open = "5"

# Configuration
config = "0.15"
toml = "0.8"

# Time
chrono = { version = "0.4", features = ["serde"] }
cron = "0.15"

# UUID
uuid = { version = "1.13", features = ["v4", "v5", "serde"] }

# Async traits
# >=0.1.92: earlier versions emit a redundant `#[must_use]` in the expansion,
# which trips `clippy::double_must_use` on nightly-2026-08-21 (issue #1248).
async-trait = "0.1.92"

# Futures
futures = "0.3"

# Crypto
aes-gcm = "0.10"
hkdf = "0.12"
sha2 = "0.10"
rand = "0.8"

# Embedded static assets
rust-embed = { version = "8", features = ["mime-guess"] }

# Regex
regex = "1"

# File system utilities
walkdir = "2"
globset = "0.4"

# Fuzzy string matching (used by fs_read "did you mean?" suggestions).
strsim = "0.11"

# Testing. `tokio-test` is intentionally retained even though no source
# references `tokio_test::*` directly (cargo-machete / cargo-udeps flag it):
# it pulls `tokio`'s `test-util` feature, which the scheduler tests
# (`tokio::time::pause()` / `advance()`) and the gateway drain tests rely on.
# Removing it breaks `cargo test`. See #1158.
tokio-test = "0.4"

[profile.release]
lto = true
codegen-units = 1
strip = true