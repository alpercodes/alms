[package]
name = "alms-runtime"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
alms-core = { path = "../alms-core" }
alms-session = { path = "../alms-session" }
alms-sandbox = { path = "../alms-sandbox" }

# Async runtime
tokio.workspace = true
tokio-util.workspace = true

# Serialization
serde.workspace = true
serde_json.workspace = true

# HTTP client
reqwest.workspace = true

# Tracing
tracing.workspace = true

# Async traits
async-trait.workspace = true

# Futures
futures.workspace = true

# Configuration
config.workspace = true

# Time
chrono.workspace = true

# UUID
uuid.workspace = true

# Concurrency
dashmap.workspace = true

[dev-dependencies]
# Pulls tokio's `test-util` feature, required by the scheduler tests
# (`tokio::time::pause()` / `advance()`) — see #1158.
tokio-test.workspace = true
tempfile = "3"
alms-test-support = { path = "../alms-test-support" }
# Integration test for the Gemini cache-expired retry cycle (#795). Scoped
# to dev-dependencies so it never ships in the binary. Pinned conservatively;
# wiremock 0.6 is stable on tokio 1 + reqwest 0.12 (our workspace pins).
wiremock = "0.6"