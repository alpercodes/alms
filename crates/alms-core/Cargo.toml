uuid.workspace = true
chrono.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
async-trait.workspace = true
aes-gcm.workspace = true
hkdf.workspace = true
sha2.workspace = true
rand.workspace = true

[dev-dependencies]
# Pulls tokio's `test-util` feature (paused-clock test helpers) — see #1158.
tokio-test.workspace = true
tempfile = "3"
alms-test-support = { path = "../alms-test-support" }