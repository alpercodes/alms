[package]
name = "alms-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[[bin]]
name = "alms"
path = "src/main.rs"

[dependencies]
alms-core = { path = "../alms-core" }
alms-gateway = { path = "../alms-gateway" }
alms-session = { path = "../alms-session" }

anyhow.workspace = true
# Embedded bash interpreter for the hidden `alms shell-host` subcommand
# (#1143). Deliberately a dependency of alms-cli ONLY — alms-sandbox just
# re-execs current_exe(), so no other crate gains a brush edge.
brush-builtins = "0.2.0"
brush-core = "0.5.0"
chrono.workspace = true
cron.workspace = true
clap.workspace = true
clap_complete.workspace = true
open.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-appender.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true

[dev-dependencies]
tempfile = "3"
# `AgentRecord::for_test` for the `agent config` / `agent create` tests.
alms-core = { path = "../alms-core", features = ["test-support"] }
