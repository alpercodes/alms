[package]
name = "alms-gateway"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
alms-core = { path = "../alms-core" }
alms-session = { path = "../alms-session" }
alms-runtime = { path = "../alms-runtime" }
alms-tools = { path = "../alms-tools" }
alms-coordinator = { path = "../alms-coordinator" }
alms-channel = { path = "../alms-channel" }

async-trait.workspace = true
axum.workspace = true
chrono.workspace = true
cron.workspace = true
dashmap.workspace = true
futures.workspace = true
parking_lot.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tokio-stream = { version = "0.1", features = ["sync"] }
tower.workspace = true
rust-embed.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
# Test-only persistence-failure injection for the episode-close retry budget
# (#1233). Dev-dependency feature: the hook is compiled out of release builds.
alms-session = { path = "../alms-session", features = ["test-support"] }
# `AgentRecord::for_test` for the registry-backed handler tests.
alms-core = { path = "../alms-core", features = ["test-support"] }
alms-test-support = { path = "../alms-test-support" }
tempfile = "3"
# Pulls tokio's `test-util` feature, required by the run-manager drain tests
# (`wait_drain` under a paused clock) — see #1158.
tokio-test.workspace = true
walkdir.workspace = true
# JS parse-sweep over `static/ui/` modules — see tests/static_assets_parse.rs.
# Pinned to the major versions current at the time of #829; bump when bumping
# any other swc_* crate in the workspace.
swc_common = "21"
swc_ecma_ast = "23"
swc_ecma_parser = "39"
