[package]
name = "alms-gateway"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
alms-core = { path = "../alms-core" }
alms-session = { path = "../alms-session" }
alms-runtime = { path = "../alms-runtime" }
alms-tools = { path = "../alms-tools" }
alms-coordinator = { path = "../alms-coordinator" }
alms-channel = { path = "../alms-channel" }

axum.workspace = true
chrono.workspace = true
cron.workspace = true
dashmap.workspace = true
parking_lot.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tokio-stream = { version = "0.1", features = ["sync"] }
tower.workspace = true
rust-embed.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
tempfile = "3"
# Pulls tokio's `test-util` feature, required by the run-manager drain tests
# (`wait_drain` under a paused clock) — see #1158.
tokio-test.workspace = true
walkdir.workspace = true
# Test-only subscriber for asserting structured WARN logs fire on the
# security path (#947). Same major version as the workspace dep.
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# JS parse-sweep over `static/ui/` modules — see tests/static_assets_parse.rs.
# Pinned to the major versions current at the time of #829; bump when bumping
# any other swc_* crate in the workspace.
swc_common = "21"
swc_ecma_ast = "23"
swc_ecma_parser = "39"