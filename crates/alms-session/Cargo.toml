[package]
name = "alms-session"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[features]
# Exposes deterministic persistence-failure injection hooks to downstream
# crates' test targets (see `JobStore::inject_persistence_failures`). Enabled
# only as a dev-dependency feature; never in a production build.
test-support = []

[dependencies]
alms-core = { path = "../alms-core" }
rusqlite = { version = "0.32", features = ["bundled"] }

dashmap.workspace = true
parking_lot.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
uuid.workspace = true
tracing.workspace = true

[dev-dependencies]
# Pulls tokio's `test-util` feature (paused-clock test helpers) — see #1158.
tokio-test.workspace = true
tempfile = "3"
