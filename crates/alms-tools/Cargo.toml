[package]
name = "alms-tools"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
alms-core = { path = "../alms-core" }
alms-session = { path = "../alms-session" }
alms-sandbox = { path = "../alms-sandbox" }

# Async runtime
tokio.workspace = true
tokio-util.workspace = true

# Serialization
serde.workspace = true
serde_json.workspace = true

# Tracing
tracing.workspace = true

# Error handling
thiserror.workspace = true

# Async traits
async-trait.workspace = true

# UUID
uuid.workspace = true

[dev-dependencies]
# Pulls tokio's `test-util` feature (paused-clock test helpers), kept uniform
# across the workspace — see #1158. (`tempfile` was removed here: unused.)
tokio-test.workspace = true
# `AgentRecord::for_test` for the registry-backed tool tests.
alms-core = { path = "../alms-core", features = ["test-support"] }
