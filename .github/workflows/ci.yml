name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  CARGO_TERM_COLOR: always
  # Use mock LLM in CI — no API key needed
  ALMS_LLM_MOCK: "1"

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install pinned Node.js
      uses: actions/setup-node@v4
      with:
        node-version-file: .node-version
        cache: npm

    - name: Install pinned npm
      run: npm install --global npm@11.18.0

    - name: Install frontend dependencies
      run: npm ci

    - name: Audit frontend dependencies
      run: npm run ui:audit

    - name: Typecheck, lint, format, and unit test
      run: npm run ui:check

    - name: Verify reproducible frontend build
      run: |
        npm run ui:build
        git diff --exit-code -- crates/alms-gateway/static/ui-dist
        test -z "$(git status --porcelain=v1 --untracked-files=all -- crates/alms-gateway/static/ui-dist)"

    - name: Install Chromium
      run: npx playwright install --with-deps chromium

    - name: Run browser smoke tests
      run: npm run ui:test:e2e

  ci:
    name: CI
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install pinned Rust nightly
      # Dated pin rather than `@nightly`: a floating nightly lets an unchanged
      # commit change its CI verdict when new lints land upstream (issue #1248).
      # This action exports RUSTUP_TOOLCHAIN, which overrides rust-toolchain.toml,
      # so both must name the same date -- bump them together.
      # `@master` is the action's documented ref for an explicit toolchain input.
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: nightly-2026-08-21
        components: rustfmt, clippy

    - name: Cache build artifacts
      uses: Swatinem/rust-cache@v2

    - name: Check formatting
      run: cargo fmt --all -- --check

    - name: Run clippy
      run: cargo clippy --all-targets --all-features -- -D warnings

    - name: Run tests
      run: cargo test --all

    - name: Build release
      run: cargo build --release

  # Dependency vulnerability audit against the RustSec advisory DB.
  # Added with PR #1144 (review S2): the brush shell engine (#1143) pulls
  # ~80 new transitive packages, a meaningful audit surface for a
  # security-sensitive component. Audits Cargo.lock only — no build, so
  # it runs as a cheap parallel job. A fuller cargo-deny setup (licenses,
  # bans, sources) is deliberately deferred to a separate infra issue.
  audit:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Run cargo audit
      uses: rustsec/audit-check@v2
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
