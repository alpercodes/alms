name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  CARGO_TERM_COLOR: always
  # Use mock LLM in CI — no API key needed
  ALMS_LLM_MOCK: "1"

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install Rust nightly
      uses: dtolnay/rust-toolchain@nightly
      with:
        components: rustfmt, clippy

    - name: Cache build artifacts
      uses: Swatinem/rust-cache@v2

    - name: Check formatting
      run: cargo fmt --all -- --check

    - name: Run clippy
      run: cargo clippy --all-targets --all-features -- -D warnings

    - name: Run tests
      run: cargo test --all

    - name: Build release
      run: cargo build --release

  # Dependency vulnerability audit against the RustSec advisory DB.
  # Added with PR #1144 (review S2): the brush shell engine (#1143) pulls
  # ~80 new transitive packages, a meaningful audit surface for a
  # security-sensitive component. Audits Cargo.lock only — no build, so
  # it runs as a cheap parallel job. A fuller cargo-deny setup (licenses,
  # bans, sources) is deliberately deferred to a separate infra issue.
  audit:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Run cargo audit
      uses: rustsec/audit-check@v2
      with:
        token: ${{ secrets.GITHUB_TOKEN }}