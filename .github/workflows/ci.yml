name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  CARGO_TERM_COLOR: always
  # Use mock LLM in CI — no API key needed
  ALMS_LLM_MOCK: "1"

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install pinned Node.js
      uses: actions/setup-node@v4
      with:
        node-version-file: .node-version
        cache: npm

    - name: Install pinned npm
      run: npm install --global npm@11.18.0

    - name: Install frontend dependencies
      run: npm ci

    - name: Typecheck, lint, format, and unit test
      run: npm run ui:check

    - name: Verify reproducible frontend build
      run: |
        npm run ui:build
        git diff --exit-code -- crates/alms-gateway/static/ui-dist
        test -z "$(git status --porcelain=v1 --untracked-files=all -- crates/alms-gateway/static/ui-dist)"

    - name: Install Chromium
      run: npx playwright install --with-deps chromium

    - name: Run browser smoke tests
      run: npm run ui:test:e2e

  ci:
    name: CI
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install pinned Rust nightly
      # Dated pin rather than `@nightly`: a floating nightly lets an unchanged
      # commit change its CI verdict when new lints land upstream (issue #1248).
      # This action exports RUSTUP_TOOLCHAIN, which overrides rust-toolchain.toml,
      # so both must name the same date -- bump them together.
      # `@master` is the action's documented ref for an explicit toolchain input.
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: nightly-2026-08-21
        components: rustfmt, clippy

    - name: Cache build artifacts
      uses: Swatinem/rust-cache@v2

    - name: Check formatting
      run: cargo fmt --all -- --check

    - name: Run clippy
      run: cargo clippy --all-targets --all-features -- -D warnings

    - name: Run tests
      run: cargo test --all

    - name: Build release
      run: cargo build --release

  # ---------------------------------------------------------------------------
  # Dependency advisory audits (issue #1252)
  #
  # These jobs answer a different question from `CI` and `Frontend`: not "did
  # this change break something" but "has the outside world changed its mind
  # about a dependency we already ship". They are separate jobs so that a red
  # cross is attributable to one question or the other.
  #
  # Policy:
  #   * A red `CI` or `Frontend` means this change broke something. That blocks.
  #   * A red `Security audit (...)` means an advisory landed. It is triaged --
  #     assessed, then fixed or filed -- not treated as a defect in whatever PR
  #     happened to run next. It does not hold up unrelated work, and nobody is
  #     required to clear someone else's advisory to land their own change.
  #
  # Why separate jobs and not just a reordered step: `npm audit` used to be the
  # first check step of `Frontend`, under `bash -e`. When it tripped, typecheck,
  # lint, format, Vitest, the bundle-reproducibility check and Playwright were
  # all skipped, and the job showed one red cross that read as "the frontend is
  # broken" when it meant "we did not check the frontend at all". That happened
  # twice in two days (#1243 undici, #1249 nanoid). `cargo audit` had been its
  # own job since #1144, so this only brings the frontend into line.
  #
  # `--omit=dev` is rejected as a fix. Both incidents were dev-only transitives,
  # so it would have suppressed exactly the signals worth keeping. The defect
  # was step ordering, not audit scope.
  # ---------------------------------------------------------------------------

  # Rust: Cargo.lock against the RustSec advisory DB.
  # Added with PR #1144 (review S2): the brush shell engine (#1143) pulls
  # ~80 new transitive packages, a meaningful audit surface for a
  # security-sensitive component. Audits Cargo.lock only -- no build, and no
  # Node toolchain -- so it stays a cheap parallel job. A fuller cargo-deny
  # setup (licenses, bans, sources) is deliberately deferred to a separate
  # infra issue. The ignore set lives in `.cargo/audit.toml` so that local
  # `cargo audit` runs and CI cannot silently disagree (#1248).
  audit-rust:
    name: Security audit (Rust)
    runs-on: ubuntu-latest
    # Installs `cargo-audit` with `--locked` and runs it. The ignore set lives in
    # `.cargo/audit.toml` so local runs and CI cannot silently disagree (#1248),
    # and the verdict is cargo-audit's own: non-zero on vulnerabilities, not on
    # informational advisories.
    #
    # `contents: read` is restated because a job-level `permissions:` block
    # replaces the defaults wholesale. It is kept rather than dropped so this job
    # carries its own least-privilege floor, instead of inheriting whatever the
    # repository default happens to be later.
    #
    # `RUSTUP_TOOLCHAIN: stable` overrides `rust-toolchain.toml`. `cargo audit`
    # reads `Cargo.lock`, which is toolchain-independent, so pinning this job to
    # the project's nightly bought nothing and cost something: it downloaded a
    # nightly plus rustfmt, clippy and rust-src that the audit never uses, and it
    # left a second way for this job to die building its tool rather than reading
    # the lockfile -- a nightly bump that breaks cargo-audit's build is the
    # `tinyvec` failure below arriving from the other direction.
    #
    # Why not `rustsec/audit-check@v2` (removed 2026-09-04). It builds
    # `cargo-audit` from source *without* `--locked`, so the tool's dependency
    # graph is re-resolved on every run against whatever is newest on crates.io.
    # `tinyvec 1.13.0` was published on 2026-09-03 and does not compile
    # (`cannot find macro `vec` in this scope`), which took this job red on every
    # branch within the hour -- while auditing nothing at all, since it died
    # building the tool rather than reading `Cargo.lock`. ALMS's own lockfile
    # pins `tinyvec 1.10.0`; the broken version was never in our graph.
    #
    # This job is a *required* status check, so its failure blocks every merge in
    # the repository. A build that re-resolves third-party dependencies on each
    # run is not a dependency worth having in that position, which is the
    # argument for `--locked` over waiting for the upstream yank.
    #
    # Two things went with the action. It published its advisory table as a check
    # run, which a plain binary cannot do -- findings now appear in the job log.
    # And that POST was the reason this job needed `checks: write`: without it
    # the POST returned "Resource not accessible by integration", and on push
    # events the action rethrew rather than falling back to stdout, so the job
    # died on *any* finding before reaching its own verdict -- which is what once
    # kept it red on an unmaintained advisory alone (#1252). No POST, no
    # permission, no failure mode; `checks: write` is dropped here.
    permissions:
      contents: read
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
    - uses: actions/checkout@v4

    - name: Install cargo-audit (locked)
      run: cargo install --locked cargo-audit

    - name: Run cargo audit
      run: cargo audit

  # Frontend: package-lock.json against the npm advisory DB. Mirrors the Rust
  # job above, but needs the pinned Node/npm toolchain: `npm audit` resolves the
  # lockfile with the local npm, and an unpinned npm has already produced a
  # lockfile that failed CI (#1248). `.node-version` plus the `packageManager`
  # and `engines` pins in `package.json` are what keep CI and local runs in
  # agreement.
  #
  # The severity threshold lives in the `ui:audit` script in `package.json`, not
  # here, so that local `npm run ui:audit` and CI use one definition.
  audit-frontend:
    name: Security audit (frontend)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install pinned Node.js
      uses: actions/setup-node@v4
      with:
        node-version-file: .node-version
        cache: npm

    - name: Install pinned npm
      run: npm install --global npm@11.18.0

    - name: Install frontend dependencies
      run: npm ci

    - name: Audit frontend dependencies
      run: npm run ui:audit
